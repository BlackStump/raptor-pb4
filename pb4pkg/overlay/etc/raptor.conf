# raptor.conf -- Vatilon PB4 (Fullhan FH8856V200 + GC4653), Raptor HAL fhan_v2
#
# Main stream for recording, sub-stream for detection / browser (Baseline).
# Rate control: CBR holds its target on this SoC (libdsp layout decoded).

[sensor]
name = gc4653                 # libgc4653_mipi.so; 2560x1440@25 (mode 0x603)

[stream0]
width = 2560
height = 1440
fps = 25
codec = h264
profile = 1                   # Main
bitrate = 4000000
rc_mode = cbr
gop = 50
osd_enabled = true            # time and uptime, drawn by rod (fh_osd.c: one plane)
jpeg = true                  # snapshots + MJPEG (console preview, /snap.jpg)

[stream1]
width = 640
height = 360
fps = 25
codec = h264
profile = 0                   # Baseline, for browsers / WebRTC
bitrate = 1000000
rc_mode = cbr
gop = 50
osd_enabled = false
jpeg = false                 # the V200 runs one MJPEG encoder: main only

[ircut]
enabled = true
mode = auto
# Latching filter: GPIO0 pulses it in (day), GPIO1 out (night).
gpio_ircut = 0
gpio_ircut2 = 1
pulse_ms = 150
hysteresis_sec = 30
# No light sensor: decide on exposure x gain (the HAL reports it in lines
# at 1x: 100-700 in a lit room, ~77000 dark). The gain trigger uses two
# fixed thresholds. day_threshold must sit below what the IR-lit night
# scene reads -- at the default 25000 the IR's own light tripped "day",
# IR off, dark, "night", IR on: cycling every few seconds.
trigger = gain
night_threshold = 40000
day_threshold = 1000
# IR LEDs on PWM channel 3 in this housing (white LEDs are on 2).
pwm_irled = 3
pwm_irled_mask = 12
pwm_irled_duty = 8500
pwm_irled_period = 10000

# Motion, on by default: rvd's software detection on stream1 (no IVS engine on the
# FH8856V200), rmd for the event. With enabled = true and the [onvif]
# section on, the NVR gets ONVIF motion events (CellMotionDetector,
# IsMotion), as the stock PB4 sends; restart Raptor and ONVIF to apply.
# sensitivity 0-4; cooldown_sec is how long an event stays on after the
# last movement. Separate from wlight, which has its own detection.
[motion]
enabled = true
algorithm = soft
sensitivity = 2
cooldown_sec = 10
record = false
event_file = /tmp/onvif_notify_server/motion_alarm

# On-screen text, drawn by rod into the main stream (the sub-stream shows
# none: the PB4 has one overlay plane, on the main stream). Positions and
# templates as on the XM550; the web console edits them under OSD.
[osd]
enabled = true

[osd.timestamp]
type = text
template = %time%
position = top_left
align = left
max_chars = 22

[osd.uptime]
type = text
template = %uptime%
position = top_right
align = right
max_chars = 18

# Motion white light (wlight): white LEDs on at night while there is
# motion. Off in a housing without white LEDs (housing ceiling). wlight
# re-reads this section every 10 s; the web console edits it under
# Recording -> White light. level in percent; hold = seconds on after the
# last motion; maxon = longest on; trigger = seconds of motion in a row
# before it switches on; thresh only counts when [motion] is off.
[wlight]
enabled = true
level = 80
hold = 15
maxon = 90
trigger = 3
thresh = 15

# The mic (libacw_mpi.so on the ARC core), on both RTSP streams. On by
# default; turn it off here or in the web UI (Audio -> Audio capture).
# G.711 at 8 kHz: what NVRs and phone apps all play. The HAL filters out
# mains hum below 250 Hz.
[audio]
enabled = true
codec = pcmu
sample_rate = 8000
volume = 80
gain = 25

# ONVIF (onvif_simple_server + WS-Discovery), for NVRs that add cameras
# by ONVIF. On by default (enabled = false and /etc/init.d/S96onvifserver
# stop to turn it off). It uses the stream
# account from [rtsp] (open while that is unset) and describes the two
# streams above; changes to either reach it on the next request.
[onvif]
enabled = true
port = 80
manufacturer = Vatilon
model = PB4-Raptor
