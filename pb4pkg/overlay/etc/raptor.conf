# raptor.conf -- Vatilon PB4 (Fullhan FH8856V200 + GC4653), Raptor HAL fhan_v2
#
# Main stream for recording, sub-stream for detection / browser (Baseline).
# Rate control: CBR holds its target on this SoC (libdsp layout decoded).

[sensor]
name = gc4653                 # libgc4653_mipi.so; 2560x1440@25 (mode 0x603)

[stream0]
width = 2560
height = 1440
fps = 25
codec = h264
profile = 1                   # Main
bitrate = 4000000
rc_mode = cbr
gop = 50
osd_enabled = false
jpeg = true                  # snapshots + MJPEG (console preview, /snap.jpg)

[stream1]
width = 640
height = 360
fps = 25
codec = h264
profile = 0                   # Baseline, for browsers / WebRTC
bitrate = 1000000
rc_mode = cbr
gop = 50
osd_enabled = false
jpeg = false                 # the V200 runs one MJPEG encoder: main only

[ircut]
enabled = true
mode = auto
# Latching filter: GPIO0 pulses it in (day), GPIO1 out (night).
gpio_ircut = 0
gpio_ircut2 = 1
pulse_ms = 150
hysteresis_sec = 3
# No light sensor: decide on exposure x gain (the HAL reports it in lines
# at 1x: 100-700 in a lit room, ~77000 dark). The gain trigger uses two
# fixed thresholds. day_threshold must sit below what the IR-lit night
# scene reads -- at the default 25000 the IR's own light tripped "day",
# IR off, dark, "night", IR on: cycling every few seconds.
trigger = gain
night_threshold = 40000
day_threshold = 1000
# IR LEDs on PWM channel 3 in this housing (white LEDs are on 2).
pwm_irled = 3
pwm_irled_mask = 12
pwm_irled_duty = 8500
pwm_irled_period = 10000
