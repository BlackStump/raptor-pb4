# wlight on the PB4 -- motion white light at night (delete this file to turn it off)
LEVEL=80        # white LEDs, percent
HOLD=15         # seconds on after the last motion
MAXON=90        # hard limit for one switch-on
TRIGGER=3       # motion frames in a row (1 s apart) before the light comes on
THRESH=15       # brightness change (0-255) for a grid cell to count
IR_VIA_RIC=1    # ric drives the IR LEDs here; off while the white light is on
